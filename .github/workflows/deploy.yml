name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup TinaCMS environment
        run: |
          echo "TINA_CLIENT_ID=${{ secrets.TINA_CLIENT_ID }}" >> $GITHUB_ENV
          echo "TINA_TOKEN=${{ secrets.TINA_TOKEN }}" >> $GITHUB_ENV
          echo "TINA_BRANCH=main" >> $GITHUB_ENV

      - name: Refresh Tina Cloud schema
        env:
          TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
        run: |
          echo "Refreshing Tina Cloud schema (no-op if already current)..."
          curl -s -X POST \
            "https://content.tinajs.io/db/${TINA_CLIENT_ID}/reset/main?refreshSchema=true&skipIfSchemaCurrent=true" \
            -H "Content-Type: application/json" \
            -H "X-API-KEY: ${TINA_TOKEN}"
          echo ""
          echo "Waiting for indexing to complete..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s \
              "https://content.tinajs.io/db/${TINA_CLIENT_ID}/status/main" \
              -H "X-API-KEY: ${TINA_TOKEN}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            echo "Status: ${STATUS}"
            if [ "$STATUS" = "complete" ]; then
              echo "Indexing complete!"
              break
            fi
            if [ "$STATUS" = "failed" ]; then
              echo "Indexing failed!"
              exit 1
            fi
            sleep 5
          done

      - name: Build Tina admin + site
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          TINA_BRANCH: main
        run: npx tinacms build --skip-cloud-checks && npx astro build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
